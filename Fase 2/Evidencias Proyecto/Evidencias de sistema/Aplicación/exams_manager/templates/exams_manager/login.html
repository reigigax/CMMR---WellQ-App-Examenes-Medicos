{% extends "base.html" %}

{% block title %}WellQ | Inicio de Sesión{% endblock %}

{% block content %}

{% load static %}

<head>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<main class="login-page">

    <section class="login-card">

        <!-- ==================================================
             LOGO
        =================================================== -->

        <div class="brand">
            <div class="brand-circle"></div>
            <span>WellQ</span>
        </div>

        <h1 class="login-title">
            Iniciar sesión
        </h1>

        <!-- ==================================================
             BLOQUE DE MENSAJES / ERRORES
        =================================================== -->
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; text-align: center;">
                        {{ message }}
                    </p>
                {% endfor %}
            </div>
        {% endif %}


        <!-- ==================================================
             FORMULARIO CONECTADO A LA VISTA
        =================================================== -->

        <form method="POST" action="{% url 'login' %}" class="login-form">

            {% csrf_token %}

            <!-- RUT -->

            <div class="field">

                <label for="rut">
                    RUT
                </label>

                <input
                    type="text"
                    id="rut"
                    name="rut"
                    placeholder="11.111.111-1"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- CONTRASEÑA -->

            <div class="field">

                <label for="password">
                    Contraseña
                </label>

                <div class="input-icon">

                    <svg class="icon-lock" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="10" rx="2"/>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                    </svg>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="•••••••"
                        autocomplete="current-password"
                        required
                    >

                    <button type="button" class="toggle-password" aria-controls="password" aria-label="Mostrar contraseña">
                        <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.4 3.3"/>
                            <path d="M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/>
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                            <path d="M3 3l18 18"/>
                        </svg>
                    </button>

                </div>

            </div>


            <!-- BOTÓN DE INGRESO -->

            <button type="submit" class="btn btn-primary">
                Continuar
            </button>
        </form>


        <!-- ==================================================
             SEPARADOR Y REGISTRO
        =================================================== -->

        <div class="separator">
            <span>o</span>
        </div>

        <a href="{% url 'sign_up' %}">
            <button type="button" class="btn btn-secondary">
                Crear cuenta
            </button>
        </a>
    </section>

</main>

<script src="{% static 'js/rut.js' %}"></script>
<script src="{% static 'js/password.js' %}"></script>
<script>
    aplicarFormatoRut(document.getElementById("rut"));
    document.querySelectorAll(".toggle-password").forEach(aplicarMostrarPassword);
</script>

{% endblock %}
