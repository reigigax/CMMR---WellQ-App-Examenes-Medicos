{% extends "base.html" %}

{% block title %}WellQ | Inicio de sesión{% endblock %}

{% block content %}

{% load static %}

<head>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>

<main class="login-page">

    <section class="login-card">

        <!-- ==================================================
             LOGO
        =================================================== -->

        <div class="brand">

            <div class="brand-circle"></div>

            <span>WellQ</span>

        </div>

        <h1 class="login-title">
            Iniciar sesión
        </h1>


        <!-- ==================================================
             FORMULARIO
        =================================================== -->

        <form method="post" class="login-form">

            {% csrf_token %}

            <!-- RUT -->

            <div class="field">

                <label for="rut">
                    RUT
                </label>

                <input
                    type="text"
                    id="rut"
                    name="rut"
                    placeholder="11.111.111-1"
                    autocomplete="username"
                >

            </div>


            <!-- CONTRASEÑA -->

            <div class="field">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="•••••••"
                    autocomplete="current-password"
                >

            </div>


            <!-- CONTINUAR -->

            <button type="submit" class="btn btn-primary">
                Continuar
            </button>

            <a href="{% url 'paciente' %}">
                <button type="button" class="btn btn-primary">
                    Continuar (PACIENTE)
                </button>
            </a>

            <a href="{% url 'clinico' %}">
                <button type="button" class="btn btn-primary">
                    Continuar (CLINICO)
                </button>
            </a>
        </form>


        <!-- ==================================================
             SEPARADOR
        =================================================== -->

        <div class="separator">
            <span>o</span>
        </div>


        <!-- CREAR CUENTA -->

        <a href="{% url 'sign_up' %}">
            <button type="button" class="btn btn-secondary">
                Crear cuenta
            </button>
        </a>
    </section>

</main>

{% endblock %}
